<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Travel Horizon | Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#202521;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:1050px;margin:35px auto;padding:0 18px}header,.line,.stats{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel{background:#fff;border:1px solid #e4dfd2;border-radius:16px;padding:20px;margin:14px 0}h1{font-size:25px}input,select,button{font:inherit;padding:10px 12px;border:1px solid #ddd8cd;border-radius:9px}input{width:100%;margin:6px 0 14px}button{background:#173d32;color:white;border-color:#173d32;cursor:pointer}.stats>div{flex:1;min-width:140px}.stats b{display:block;font-size:25px}.booking{padding:14px 0;border-bottom:1px solid #eee;display:grid;grid-template-columns:1fr auto;gap:12px}.booking small{display:block;color:#66716a}.actions{display:flex;gap:8px}.actions select{max-width:140px}.muted{color:#66716a}#msg{color:#a2461f;min-height:24px}.hidden{display:none!important}@media(max-width:650px){.booking{grid-template-columns:1fr}.wrap{margin:18px auto}}
</style></head><body><main class="wrap"><header><div><h1>Travel Horizon · Админ-панель</h1><div class="muted">Управление входящими заявками</div></div><button id="logout" class="hidden">Выйти</button></header>
<section id="login" class="panel"><h2>Вход</h2><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Пароль<input name="password" type="password" required autocomplete="current-password"></label><button>Войти</button></form></section>
<section id="dash" class="hidden"><div class="stats"><div class="panel">Всего заявок<b id="total">0</b></div><div class="panel">Новые<b id="new">0</b></div><div class="panel">Подтверждены<b id="confirmed">0</b></div></div><section class="panel"><div class="line"><h2>Заявки</h2><button id="refresh">Обновить</button></div><p id="msg" role="status"></p><div id="list"></div></section></section></main>
<script>
const $=s=>document.querySelector(s);let token=sessionStorage.getItem('th_admin_token')||'';
async function api(action,method='GET',body){const r=await fetch('/api/admin?action='+action,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Ошибка сервера');return j}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const [s,b]=await Promise.all([api('stats'),api('bookings')]);$('#total').textContent=s.total;$('#new').textContent=s.new;$('#confirmed').textContent=s.confirmed;$('#msg').textContent='';$('#list').innerHTML=b.bookings.length?b.bookings.map(x=>'<article class="booking"><div><b>'+esc(x.name)+'</b><small>'+esc(x.tour)+' · '+esc(x.date)+' · '+esc(x.email||x.phone||'')+'</small><small>'+esc(x.notes||'')+'</small><small>'+esc(x.created_at)+'</small></div><div class="actions"><select data-id="'+esc(x.id)+'"><option value="new">Новая</option><option value="contacted">Связались</option><option value="confirmed">Подтверждена</option><option value="cancelled">Отменена</option></select><button data-save="'+esc(x.id)+'">Сохранить</button></div></article>').join(''):'Заявок пока нет';b.bookings.forEach(x=>{const el=document.querySelector('select[data-id="'+x.id+'"]');if(el)el.value=x.status||'new'})}catch(e){$('#msg').textContent=e.message}}
function show(){const yes=!!token;$('#login').classList.toggle('hidden',yes);$('#dash').classList.toggle('hidden',!yes);$('#logout').classList.toggle('hidden',!yes);if(yes)load()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/admin?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});const j=await r.json();if(!r.ok)throw Error(j.error||'Не удалось войти');token=j.access_token;sessionStorage.setItem('th_admin_token',token);show()}catch(x){$('#msg').textContent=x.message}};
$('#list').onclick=async e=>{const id=e.target.dataset.save;if(!id)return;try{await api('booking','PATCH',{id,status:document.querySelector('select[data-id="'+id+'"]').value});await load()}catch(x){$('#msg').textContent=x.message}};
$('#refresh').onclick=load;$('#logout').onclick=()=>{token='';sessionStorage.removeItem('th_admin_token');show()};show();
</script></body></html>
