function geoPath(coords,X,Y){
 if(!Array.isArray(coords)||!coords.length)return '';
 if(typeof coords[0]?.[0]==='number')return coords.map((c,i)=>(i?'L':'M')+X(c[0])+','+Y(c[1])).join(' ')+' Z';
 return coords.map(r=>geoPath(r,X,Y)).join(' ');
}

async function loadKyrgyzstanBoundaries(){
 if(KG_BOUNDARY||KG_BOUNDARY_LOADING||!LM)return;
 KG_BOUNDARY_LOADING=true;
 try{
  const response=await fetch('/data/kyrgyzstan-regions.geojson');
  if(!response.ok)throw new Error('GeoJSON '+response.status);
  const geo=await response.json();
  if(!geo.features||geo.features.length<7)throw new Error('Incomplete Kyrgyzstan oblast GeoJSON');
  KG_BOUNDARY=L.geoJSON(geo,{
   style:()=>({color:'#b78c4b',weight:2.2,opacity:1,fillColor:'#b7cbbd',fillOpacity:.24}),
   onEachFeature:(feature,layer)=>{
    const name=String(feature.properties?.name||feature.properties?.NAME_1||'');
    if(name)layer.bindTooltip(name,{sticky:true,direction:'center'});
    layer.on('mouseover',()=>layer.setStyle({weight:3.5,fillOpacity:.42}));
    layer.on('mouseout',()=>KG_BOUNDARY.resetStyle(layer));
    layer.on('click',()=>{
     const key=REGION_GROUP[name.toLowerCase()];
     if(key){mreg=mreg===key?'':key;chips();lmap()}
     if(layer.getBounds().isValid())LM.fitBounds(layer.getBounds(),{padding:[24,24],maxZoom:8});
    });
   }
  }).addTo(LM);
  const bounds=KG_BOUNDARY.getBounds();
  if(bounds.isValid())LM.fitBounds(bounds,{padding:[22,22],maxZoom:7});
 }catch(err){console.error('Kyrgyzstan map boundary error',err)}
 finally{KG_BOUNDARY_LOADING=false}
}

async function loadCommonsPhotos(){
 const jobs=D.map(async d=>{
  try{
   const q=encodeURIComponent(pk(d.n).split('|')[0]+' Kyrgyzstan');
   const url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+q+'&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1000&format=json&origin=*';
   const res=await fetch(url);if(!res.ok)return;
   const data=await res.json(),pages=Object.values(data.query?.pages||{});
   const p=pages.find(x=>/\.(jpg|jpeg|png|webp)$/i.test(x.title||'')&&x.imageinfo?.[0]?.thumburl);
   if(!p)return;
   const info=p.imageinfo[0],meta=info.extmetadata||{};
   IMG[d.id]=info.thumburl;
   const credit=[meta.Artist?.value,meta.LicenseShortName?.value].filter(Boolean).join(' · ');
   IMG[d.id+'__credit']=(p.title||'Wikimedia Commons')+' | '+credit+' | https://commons.wikimedia.org/wiki/'+encodeURIComponent(p.title||'');
  }catch(e){/* Illustration fallback remains available when Commons is unreachable. */}
 });
 await Promise.allSettled(jobs);
 dests();grid();exps();if(typeof LM!=='undefined'&&LM)lmap();else map();
}

loadCommonsPhotos();

/* Administrative outlines from the open geoBoundaries API. */
async function loadKyrgyzstanBoundaries(){
 if(window.__thBordersStarted||!window.L)return;window.__thBordersStarted=true;
 try{
  const meta=await fetch('https://www.geoboundaries.org/api/current/gbOpen/KGZ/ADM1/').then(r=>r.ok?r.json():null);
  if(!meta?.gjDownloadURL)return;
  const geo=await fetch(meta.gjDownloadURL).then(r=>r.ok?r.json():null);
  if(!geo||!LM)return;
  L.geoJSON(geo,{style:()=>({color:'#b28a4c',weight:1.4,opacity:.8,fillColor:'#d8c7a5',fillOpacity:.07,dashArray:'4 4'}),interactive:false}).addTo(LM);
 }catch(e){/* Map markers and OpenStreetMap tiles remain usable without boundaries. */}
}

setTimeout(loadKyrgyzstanBoundaries,1200);
</script>
