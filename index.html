body{margin:0;font:16px/1.6 Manrope,Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg)}

.b.o{background:transparent;color:var(--fg);border-color:var(--ln)}

.hero .bgi{position:absolute;inset:0}.hero .bgi svg{width:100%;height:100%;display:block}

.hero p.sb{max-width:620px;font-size:1.15rem}

.sr .b{background:var(--ac);color:var(--acf);border-color:var(--ac)}

.intro{max-width:760px;font-size:1.35rem;font-weight:600}
.dg,.tgd{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}

.c{background:var(--cd);border-radius:20px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.08);transition:transform .25s;display:flex;flex-direction:column;animation:up .5s both}

.im{position:relative;height:210px;overflow:hidden}.im svg{width:100%;height:100%;display:block}

.cb{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}.cb p{margin:0}.cb .row{margin-top:auto}

.more{text-align:center;margin-top:28px}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.ex button{all:unset;cursor:pointer;position:relative;border-radius:18px;overflow:hidden;height:190px;display:block}
.ex button:focus-visible{outline:3px solid #c9a24b}
.ex svg{width:100%;height:100%;display:block}.ex span{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;color:#fff;font-weight:700;background:linear-gradient(transparent,rgba(10,25,20,.85))}
.mapw{display:grid;grid-template-columns:2fr 1fr;gap:20px}@media(max-width:800px){.mapw{grid-template-columns:1fr}}
.mbg{fill:var(--mb)}.lk{fill:#25a39b;opacity:.6}.gl{stroke:var(--ln)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chips .b{padding:6px 14px;font-size:.85rem}
.mc{background:var(--cd);border-radius:18px;overflow:hidden}.mc .cb{gap:6px}
.pr3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.pr3>div{background:var(--cd);border-radius:16px;padding:20px}

.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end;margin-top:20px}

dlg.addEventListener('input',e=>{const f=e.target.form;if(f&&f.id=='bf'&&f.dataset.r){delete f.dataset.r;$('#sm').hidden=true;$('#fb2').textContent=t('frv')}});
dlg.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id!='bf')return;const v=Object.fromEntries(new FormData(f)),er={},x=TR.find(y=>y.id==f.dataset.id);
if(!v.name.trim())er.name='e_name';if(!v.country.trim())er.country='e_country';const ph=v.phone.trim(),em=v.email.trim();if(!em&&!ph)er.contact='e_contact';else{if(em&&!/^\S+@\S+\.\S+$/.test(em))er.email='e_email';if(ph&&!/^[0-9 ()\-]{5,15}$/.test(ph))er.contact='e_phone';if(ph&&!/^\+\d{1,4}$/.test(v.cc.trim()))er.contact='e_cc'}if(!f.elements.consent.checked)er.consent='e_consent';if(!v.date||new Date(v.date)<=new Date())er.date='e_date';const n=+v.trav;if(!(n>=1&&n<=20))er.trav='e_trav';
f.querySelectorAll('[data-e]').forEach(m=>m.textContent=er[m.dataset.e]?t(er[m.dataset.e]):'');
const ks=Object.keys(er);if(ks.length){(f.elements[ks[0]]||f.elements.phone).focus();return}
if(!f.dataset.r){f.dataset.r=1;const s=$('#sm');s.hidden=false;s.textContent=`${pk(x.n)} · ${v.name} · ${v.email} · ${v.date} · ${n} ${t('ftr')} · ${t('from')} ${usd(x.p*n)} (${t('il')})`;$('#fb2').textContent=t('fsd');return}
const bt=$('#fb2');bt.disabled=true;try{const j=await submitRequest({...v,consent:true,lang:v.lg||L,tour:x.id,key:KEY});$('#res').textContent=`${t('sent')} ${j.ref}`;bt.hidden=true;KEY=crypto.randomUUID()}catch(err){$('#res').textContent=t('err');bt.disabled=false}});
dlg.addEventListener('input',e=>{const n=e.target.name;if(n=='cc')e.target.dataset.m=1;if(n=='country'){const c=Object.keys(CC).find(k=>cname(k)==e.target.value),cc=e.target.form.elements.cc;if(c&&!cc.dataset.m)cc.value='+'+CC[c]}});
$('#dx').onclick=()=>dlg.close();dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
const go=s=>$(s).scrollIntoView();
document.addEventListener('click',e=>{const a=e.target.closest('[data-t],[data-d],[data-x],[data-mk],[data-rg],[data-ty],[data-ft],#dm,#clr,#clr2,#bg,#nv a');if(!a)return;
if(a.id=='bg'){const o=$('#nv').classList.toggle('open');a.setAttribute('aria-expanded',o);return}
if(a.closest('#nv')){$('#nv').classList.remove('open');return}
if(a.id=='dm'){showAll=!showAll;dests();return}
if(a.id=='clr'||a.id=='clr2'){F=dflt();filters();grid();return}
if(a.dataset.t){openTour(a.dataset.t,a.dataset.f);return}
if(a.dataset.d){openDest(a.dataset.d);return}
if(a.dataset.x!==undefined){if(!a.dataset.x){go('#planner');return}F=dflt();F.ty=a.dataset.x;filters();grid();go('#tours');return}
if(a.dataset.mk){sel=a.dataset.mk;map();const g=$(`[data-mk="${sel}"]`);if(g)g.focus();return}
if(a.dataset.ty!==undefined){mty=a.dataset.ty;map();return}
if(a.dataset.rg!==undefined){mreg=a.dataset.rg;map();return}
if(a.dataset.ft){dlg.close();F=dflt();F.ds=a.dataset.ft;filters();grid();go('#tours')}});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.dataset&&e.target.dataset.mk){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#fl').addEventListener('input',e=>{const m={fb:['bud',Number],fd:['dur',Number],fdf:['df',String],fty:['ty',String],fds:['ds',String],fmo:['mo',Number],fso:['so',String]}[e.target.id];if(!m)return;F[m[0]]=m[1](e.target.value);$('#bv').textContent=usd(F.bud);$('#dv').textContent=F.dur;grid()});
$$('.lang').forEach(s=>s.addEventListener('change',e=>{L=e.target.value;try{localStorage.setItem('thl',L)}catch(x){}render()}));
$('#hs').addEventListener('submit',e=>{e.preventDefault();F=dflt();F.ds=$('#hd').value;F.ty=$('#hty').value;PD=$('#hdt').value;PT=Math.min(20,Math.max(1,+$('#htr').value||2));if(PD)F.mo=new Date(PD+'T12:00').getMonth()+1;filters();grid();go('#tours')});
$('#hdt').min=new Date().toISOString().slice(0,10);
$('#pf').addEventListener('submit',e=>{e.preventDefault();const f=e.target,q=+f.days.value,bd=+f.bud.value,ac=f.act.value,mo=+f.mon.value,df=f.df.value;
const s=TR.map(x=>{const b=[];if(x.d>q)b.push('pd');if(x.p>bd)b.push('pbud');if(ac&&!x.ty.includes(ac))b.push('pa');if(mo<x.m[0]||mo>x.m[1])b.push('pm');if(df&&x.df!=df)b.push('f3');return{x,b}});
const ok=s.filter(z=>!z.b.length),l=ok.length?ok:s.sort((a,b)=>a.b.length-b.b.length).slice(0,3);
$('#pres').innerHTML=`<p style="margin-top:16px"><b>${ok.length?t('pok'):t('pnone')}</b></p>`+l.map(z=>`<div class="pres"><span><b>${pk(z.x.n)}</b> · ${z.x.d} ${t('days')} · ${usd(z.x.p)} ${z.b.map(k=>`<span class="bad">${t(k)}</span>`).join(' ')}</span><button type="button" class="b o" data-t="${z.x.id}">${t('view')}</button></div>`).join('')});
render();
</script>
</body>
</html>
